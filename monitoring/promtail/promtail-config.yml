# Promtail discovers Docker containers, reads their JSON log files, and pushes
# structured entries to Loki over the shared monitoring network.
server:
  http_listen_port: 9080 # Promtail metrics/health endpoint inside the network.
  grpc_listen_port: 0 # Disable the unused gRPC server.

positions:
  filename: /tmp/positions.yaml # Persisted in the promtail_positions volume.

clients:
  - url: http://loki:3100/loki/api/v1/push # Loki ingestion endpoint.

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s # Refresh container discovery frequently.
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container # Add the friendly container name to each log.
      - source_labels: [__meta_docker_container_label_environment]
        target_label: environment # staging/production label from Compose.
      - source_labels: [__meta_docker_container_label_app]
        target_label: app # Application label from Compose.
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {} # Decode Docker's outer JSON log envelope.
      - json:
          # Extract fields emitted by the application's structured logger.
          expressions:
            level: level
            endpoint: endpoint
            method: method
            status: status
            environment: environment
      - labels:
          level: # Promote log severity to a Loki label for filtering.
