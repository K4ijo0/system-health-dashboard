# Prometheus scrapes the two application containers by their shared-network
# aliases. The aliases are defined in the staging/production Compose files.
global:
  scrape_interval: 15s # How often application metrics are collected.
  evaluation_interval: 15s # How often alert/recording rules are evaluated.

# Load alert rules from the mounted monitoring/prometheus/alerts.yml file.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: system-health
    metrics_path: /metrics # Flask endpoint exposing Prometheus metrics.
    static_configs:
      - targets: ["app-staging:5000"]
        labels:
          environment: staging # Keep dashboards filterable by environment.
      - targets: ["app-production:5000"]
        labels:
          environment: production
